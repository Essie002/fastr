# Applying migrations and deploying Edge Functions to the hosted project. Requirement 21.4.
#
# Manual only, and deliberately so. A migration is not reversible by re-running the previous workflow, and a schema
# change landing automatically at the same moment as the front end that depends on it is a race worth not having.
#
# This holds the only long-lived secret in the project, which is why it is a separate workflow in a protected
# environment rather than a step in the Pages deploy.

name: Deploy to Supabase

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to confirm you have read the migration diff
        required: true
        default: ''

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Push migrations and functions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Whatever reviewers this environment is configured with, so a deploy is a decision rather than a button. The secret
    # below is scoped to it.
    environment: production

    steps:
      - name: Check the confirmation
        # Cheap, and it stops a mis-click on the Run workflow button from applying a migration.
        if: ${{ github.event.inputs.confirm != 'deploy' }}
        run: |
          echo 'Type "deploy" in the confirm field to proceed.'
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Link the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}

      # Printed before anything is applied, so the log contains a record of what this deploy changed. Worth having when
      # working out what happened to a database weeks later.
      - name: Show what will change
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase migration list

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase db push

      # Functions after migrations, because the sender calls claim_due_notifications: deployed first, it would run
      # against a database without that function.
      - name: Deploy the Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # verify_jwt stays off for the sender only; it is called by cron, which has no user. The setting lives in
          # config.toml and the CLI reads it from there.
          npx supabase functions deploy send-notifications
          npx supabase functions deploy delete-account
          npx supabase functions deploy import-data

      - name: Remind what is not automated
        run: |
          echo "Secrets and the cron settings are not deployed by this workflow. Once per project:"
          echo "  npx supabase secrets set VAPID_PUBLIC_KEY=... VAPID_PRIVATE_KEY=... VAPID_SUBJECT=... CRON_SECRET=..."
          echo "  alter database postgres set app.settings.functions_url = 'https://<ref>.supabase.co/functions/v1';"
          echo "  alter database postgres set app.settings.cron_secret   = '<the same CRON_SECRET>';"
          echo "See the README."
