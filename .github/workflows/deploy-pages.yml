# Publishing the web app to GitHub Pages. Requirement 21.
#
# Runs only after CI has passed on `main`, through `workflow_run`, rather than duplicating the test suite here. A deploy
# workflow that runs its own abbreviated checks is a deploy that can succeed while CI fails.

name: Deploy to Pages

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  # So a deploy can be re-run without pushing an empty commit.
  workflow_dispatch:

concurrency:
  group: pages
  # Not cancelled in progress: a half-finished Pages deployment is worse than a queued one.
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish
    # The gate. A failed or cancelled CI run must not reach this.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      # Both are required by actions/deploy-pages, and nothing else here needs any permission at all.
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default, which is right here but worth being explicit about:
          # deploying a different commit from the one CI verified would defeat the gate.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        env:
          # Repository *variables*, not secrets. Both are public by design — the anon key identifies the project and Row
          # Level Security is what protects the data — and Vite bakes them into the bundle, so hiding them in secrets
          # would conceal them from the maintainer while shipping them to every visitor.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY as repository variables first."
            echo "Without them the app builds and then refuses to start, which is a worse way to find out."
            exit 1
          fi
          npm run build

      - name: Confirm the SPA fallback was written
        # Pages serves 404.html for any unmatched path, which is the only reason a deep link loads at all. If the build
        # step that copies it ever breaks, every bookmark and refresh breaks with it — silently, and only in production.
        run: test -f packages/web/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
