# Serving the built SPA.
#
# Short, and every line is here for a reason the GitHub Pages deployment cannot address.

server {
  # Matches the Dockerfile's EXPOSE and the non-root user: a port above 1024 needs no privileges.
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;

  # The app is built with base '/fastr/', so its assets live under that path. Anything arriving at the root is sent
  # there rather than 404ing, which is what happens when someone opens the container's address without the suffix.
  location = / {
    return 302 /fastr/;
  }

  location /fastr/ {
    alias /usr/share/nginx/html/;

    # The SPA fallback. Unlike GitHub Pages, a real server can serve index.html with a 200 for an unmatched path, so a
    # deep link here is a genuine 200 rather than the 404.html trick the Pages deployment needs.
    try_files $uri $uri/ /index.html;
  }

  # Hashed filenames can be cached indefinitely: a given URL can never change meaning.
  location ~* /fastr/assets/.*\.(js|css|woff2?|png|svg)$ {
    alias /usr/share/nginx/html/;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The service worker must not be cached, or a stale one keeps serving a stale app shell for as long as its own cache
  # headers say — which is how a PWA gets stuck on an old version with no way to update.
  location = /fastr/service-worker.js {
    alias /usr/share/nginx/html/service-worker.js;
    add_header Cache-Control "no-cache";
  }

  # The headers GitHub Pages cannot set. Running here rather than on Pages is the only way Fastr gets them, which is
  # the honest argument for keeping this image around.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # frame-ancestors is ignored in a meta tag, so this is the first time the app is actually protected from framing.
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header X-Frame-Options "DENY" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
